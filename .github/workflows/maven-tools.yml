name: maven-tools

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # exchanged for a Cloudsmith token through OIDC

env:
  # The CLI also reads CLOUDSMITH_ORG as the workspace whose custom domains it lists.
  CLOUDSMITH_ORG: iduffy-demo
  CLOUDSMITH_REPO: default

jobs:
  example:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - maven-global
          - maven-mavenrc
          - maven-local
          - gradle-global
          - sbt-global
          - sbt-local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The action sets the OIDC environment for every later step, and signs in once to check it.
      # It runs before mise, so the PATH entries of mise come first.
      - name: Set up the Cloudsmith CLI with OIDC
        uses: cloudsmith-io/cloudsmith-cli-action@v3
        with:
          oidc-namespace: ${{ env.CLOUDSMITH_ORG }}
          oidc-service-slug: github-c3xe
          verify-auth: "true"

      - name: Set up Java, Maven, Gradle, sbt, and uv with mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # mise 2026.10.21 fails to lock Maven 3.9.11 for the tasks that use it.
          version: 2026.10.17

      # The released CLI has no `credential-helper install maven`. Inside `mise run`, the CLI from
      # the pull request comes first on PATH. Remove this step after the CLI release.
      - name: Install the CLI from cloudsmith-io/cloudsmith-cli#520
        run: mise run cli

      - name: Run the example
        run: mise run "example:${{ matrix.example }}"

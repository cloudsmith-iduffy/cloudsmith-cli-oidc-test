name: maven-oidc

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'maven-example/**'
      - '.github/workflows/maven-oidc.yml'

permissions:
  contents: read
  id-token: write          # REQUIRED: without this the GitHub Actions OIDC detector skips

jobs:
  maven-oidc:
    runs-on: ubuntu-latest
    env:
      CLOUDSMITH_ORG: iduffy-demo
      CLOUDSMITH_REPO: default
      CLOUDSMITH_SERVICE_SLUG: github-c3xe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install cloudsmith-cli (Maven shell-plugin branch)
        run: pip install "git+https://github.com/cloudsmith-io/cloudsmith-cli.git@iduffy/credential-helper-maven"

      - name: Verify OIDC auth round-trip
        run: cloudsmith whoami --verbose

      - name: Configure the Maven shell plugin
        run: |
          cloudsmith credential-helper install maven \
            --org "$CLOUDSMITH_ORG" --repo "$CLOUDSMITH_REPO" --no-discover
          # Put the shims dir ahead of the real mvn for every subsequent step.
          # (Interactively this is: eval "$(cloudsmith credential-helper shell-init)")
          echo "$HOME/.cloudsmith/shims" >> "$GITHUB_PATH"

      - name: Build (download dep) + native deploy via the shadowed mvn
        working-directory: maven-example
        run: |
          # `mvn` now resolves to the Cloudsmith shim — no API key anywhere.
          which mvn
          mvn -B -ntp versions:set -DnewVersion="0.0.${GITHUB_RUN_NUMBER}"
          mvn -B -ntp clean deploy

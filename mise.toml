[tools]
java = "temurin-17"
"aqua:apache/maven" = "3.10.0"
gradle = "9.8.1"
"github:sbt/sbt" = "1.13.0"
uv = "0.13.4"

[env]
# The branch of cloudsmith-io/cloudsmith-cli that `mise run cli` installs.
CLOUDSMITH_CLI_REF = "iduffy/credential-helper-jvm"
# Keep that CLI in this checkout, apart from other cloudsmith commands on PATH.
UV_TOOL_DIR = "{{config_root}}/.tools/uv"
UV_TOOL_BIN_DIR = "{{config_root}}/.tools/bin"
_.path = ["{{config_root}}/.tools/bin"]

[tasks.cli]
description = "Install the Cloudsmith CLI from the branch in CLOUDSMITH_CLI_REF"
run = 'uv tool install --force "cloudsmith-cli @ git+https://github.com/cloudsmith-io/cloudsmith-cli@${CLOUDSMITH_CLI_REF}"'

[tasks."example:maven-global"]
description = "Maven 3.10: set up every build through ~/.m2/extensions.xml, then deploy"
dir = "{{config_root}}/maven-tools/maven/global"
run = "../../run.sh maven global"

[tasks."example:maven-mavenrc"]
description = "Maven 3.9: set up every build through ~/.mavenrc, then deploy"
dir = "{{config_root}}/maven-tools/maven/mavenrc"
tools = { "aqua:apache/maven" = "3.9.11" }
run = "../../run.sh maven mavenrc"

[tasks."example:maven-local"]
description = "Maven 3.9: set up one project through .mvn/extensions.xml, then deploy"
dir = "{{config_root}}/maven-tools/maven/local"
tools = { "aqua:apache/maven" = "3.9.11" }
run = "../../run.sh maven local"

[tasks."example:gradle-global"]
description = "Gradle: set up every build through an init script, then publish"
dir = "{{config_root}}/maven-tools/gradle/global"
run = "../../run.sh gradle global"

[tasks."example:gradle-local"]
description = "Gradle: apply the plugin in settings.gradle.kts of one build, then publish"
dir = "{{config_root}}/maven-tools/gradle/local"
run = "../../run.sh gradle local"

[tasks."example:sbt-global"]
description = "sbt: set up every build through a global plugin, then publish"
dir = "{{config_root}}/maven-tools/sbt/global"
run = "../../run.sh sbt global"

[tasks."example:sbt-local"]
description = "sbt: set up one build through project/cloudsmith.sbt, then publish"
dir = "{{config_root}}/maven-tools/sbt/local"
run = "../../run.sh sbt local"

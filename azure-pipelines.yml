trigger:
- main

pool:
  name: 'Default'

variables:
  CLOUDSMITH_ORG: iduffy-demo
  CLOUDSMITH_SERVICE_SLUG: azure-devops-gqgp

steps:
- task: Bash@3
  displayName: 'OIDC smoke test via cloudsmith-cli'
  env:
    # System.AccessToken is not exposed to scripts by default; map it in.
    # System.OidcRequestUri is mapped explicitly so the detector reads it from env.
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
    CLOUDSMITH_ORG: $(CLOUDSMITH_ORG)
    CLOUDSMITH_SERVICE_SLUG: $(CLOUDSMITH_SERVICE_SLUG)
  inputs:
    targetType: 'inline'
    script: |
      set -euo pipefail
      python3 -m venv /tmp/venv
      . /tmp/venv/bin/activate
      pip install --quiet --upgrade pip
      pip install "git+https://github.com/cloudsmith-io/cloudsmith-cli.git@iduffy/azure-devops"

      # NOTE: do not use --debug here. It enables HTTP wire logging which prints
      # the X-Api-Key header (the exchanged Cloudsmith token) into the build log.
      # This pipeline's logs are public, so --verbose only.
      echo "=== whoami: OIDC auto-discovery ==="
      cloudsmith whoami --verbose

      echo "=== authenticated API call ==="
      cloudsmith list repos "$CLOUDSMITH_ORG"

trigger:
- main

pool:
  name: 'Default'

steps:
- task: Bash@3
  displayName: 'OIDC diagnostic: api-version + claims'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
  inputs:
    targetType: 'inline'
    script: |
      set -uo pipefail

      echo "=== request URI (host only) ==="
      echo "$SYSTEM_OIDCREQUESTURI" | sed -E 's#(https://[^/]+/).*#\1...#'

      echo "=== bare URI (no api-version) ==="
      curl -s -o /tmp/bare.json -w "HTTP %{http_code}\n" -X POST \
        -H "Content-Length: 0" -H "Content-Type: application/json" \
        -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        "$SYSTEM_OIDCREQUESTURI"
      echo "--- body (first 300 chars) ---"; head -c 300 /tmp/bare.json; echo

      echo "=== with api-version=7.1 ==="
      curl -s -o /tmp/v.json -w "HTTP %{http_code}\n" -X POST \
        -H "Content-Length: 0" -H "Content-Type: application/json" \
        -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        "$SYSTEM_OIDCREQUESTURI?api-version=7.1"
      decode_aud() {
        local tok="$1"
        local payload
        payload=$(echo "$tok" | cut -d. -f2 | tr '_-' '/+')
        while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
        echo "$payload" | base64 -d 2>/dev/null | jq '{iss, sub, aud}'
      }

      TOKEN=$(jq -r '.oidcToken // empty' /tmp/v.json)
      echo "token retrieved (no audience body): ${TOKEN:+yes}"
      [ -n "$TOKEN" ] && { echo "--- claims (no audience body) ---"; decode_aud "$TOKEN"; }

      echo "=== with api-version=7.1 + body {\"audience\":\"cloudsmith\"} ==="
      curl -s -o /tmp/aud.json -w "HTTP %{http_code}\n" -X POST \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        -d '{"audience":"cloudsmith"}' \
        "$SYSTEM_OIDCREQUESTURI?api-version=7.1"
      TOKEN2=$(jq -r '.oidcToken // empty' /tmp/aud.json)
      echo "token retrieved (audience=cloudsmith): ${TOKEN2:+yes}"
      [ -n "$TOKEN2" ] && { echo "--- claims (audience=cloudsmith) ---"; decode_aud "$TOKEN2"; }

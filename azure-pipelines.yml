trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: Bash@3
  displayName: 'OIDC diagnostic: api-version + claims'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
  inputs:
    targetType: 'inline'
    script: |
      set -uo pipefail

      echo "=== request URI (host only) ==="
      echo "$SYSTEM_OIDCREQUESTURI" | sed -E 's#(https://[^/]+/).*#\1...#'

      echo "=== bare URI (no api-version) ==="
      curl -s -o /tmp/bare.json -w "HTTP %{http_code}\n" -X POST \
        -H "Content-Length: 0" -H "Content-Type: application/json" \
        -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        "$SYSTEM_OIDCREQUESTURI"
      echo "--- body (first 300 chars) ---"; head -c 300 /tmp/bare.json; echo

      echo "=== with api-version=7.1 ==="
      curl -s -o /tmp/v.json -w "HTTP %{http_code}\n" -X POST \
        -H "Content-Length: 0" -H "Content-Type: application/json" \
        -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        "$SYSTEM_OIDCREQUESTURI?api-version=7.1"
      TOKEN=$(jq -r '.oidcToken // empty' /tmp/v.json)
      echo "token retrieved: ${TOKEN:+yes}"

      if [ -n "$TOKEN" ]; then
        PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
        while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
        echo "=== TOKEN CLAIMS (iss / sub / aud) ==="
        echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{iss, sub, aud, iat, exp}'
      fi

# OIDC smoke test for cloudsmith-cli's Google Cloud detector on Google Cloud Build.
#
# This pipeline is intentionally public so it can serve as a verifiable proof of
# the Google Cloud OIDC auto-discovery flow. For that reason it must never print
# secrets:
#   - It does NOT use `cloudsmith --debug` (that logs the X-Api-Key header, i.e.
#     the exchanged Cloudsmith token, into the build log).
#   - It prints only the *decoded claims* (iss/sub/aud/email) of the OIDC token,
#     never the raw signed JWT (which is a short-lived bearer credential).
#
# Run it:
#   gcloud builds submit --config cloudbuild.yaml --no-source --project <PROJECT>
#
# On Cloud Build the detector resolves the ambient identity via the metadata
# server (compute_engine credentials) and mints a Google ID token with:
#   iss: https://accounts.google.com   aud: cloudsmith   sub: <build SA unique id>
#
# Prerequisite: the `google-10rf` service in `iduffy-demo` must trust Google's
# issuer (https://accounts.google.com) with audience `cloudsmith` and subject
# equal to the `sub` printed by the first step below (the Cloud Build runtime
# service account's numeric unique id).

steps:
  - id: show-oidc-claims
    name: python:3.12
    entrypoint: python3
    args:
      - -c
      - |
        import base64, json, urllib.request

        url = (
            "http://metadata.google.internal/computeMetadata/v1/"
            "instance/service-accounts/default/identity"
            "?audience=cloudsmith&format=full"
        )
        request = urllib.request.Request(url, headers={"Metadata-Flavor": "Google"})
        token = urllib.request.urlopen(request, timeout=10).read().decode()

        payload = token.split(".")[1]
        payload += "=" * (-len(payload) % 4)
        claims = json.loads(base64.urlsafe_b64decode(payload))

        print("Decoded OIDC claims (no raw JWT, no secrets):")
        for key in ("iss", "aud", "sub", "email", "exp"):
            print(f"  {key}: {claims.get(key)}")

  - id: oidc-roundtrip
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --upgrade pip
        pip install --quiet \
          "cloudsmith-cli[gcp] @ git+https://github.com/cloudsmith-io/cloudsmith-cli.git@iduffy/gcp-oidc"

        echo "=== whoami: OIDC auto-discovery ==="
        cloudsmith whoami --verbose

        echo "=== authenticated API call ==="
        cloudsmith list repos "$CLOUDSMITH_ORG"

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - CLOUDSMITH_ORG=iduffy-demo
    - CLOUDSMITH_SERVICE_SLUG=google-10rf
